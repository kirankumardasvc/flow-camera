<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>FlowLite — Scan & Pay</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--ink:#17151a;--muted:#77717d;--line:#e9e5eb;--brand:#22002d;--accent:#20d38b;--soft:#f7f5f8;--danger:#c23b4a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#fff;color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{display:flex;justify-content:center}.wrap{width:100%;max-width:520px;min-height:100vh;padding:14px 14px 24px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:var(--brand);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 8px 20px #22002d22}.logo span{font-weight:950;font-size:18px;letter-spacing:-2px;color:#fff;line-height:1}.logo i{position:absolute;width:18px;height:5px;background:var(--accent);right:4px;top:8px;border-radius:8px;transform:rotate(-22deg)}.brand b{font-size:18px;letter-spacing:-.5px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:1px}.close{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:21px;color:#555;display:grid;place-items:center}
.hero{text-align:center;padding:5px 8px 13px}.qr-mark{width:62px;height:62px;margin:0 auto 10px;border-radius:20px;background:var(--brand);display:grid;place-items:center;position:relative;box-shadow:0 12px 28px #22002d20}.qr-mark svg{width:42px;height:42px}.qr-mark:after{content:"";position:absolute;right:7px;top:7px;width:15px;height:5px;border-radius:8px;background:var(--accent);transform:rotate(-22deg)}h1{font-size:23px;margin:0;font-weight:900;letter-spacing:-.7px}.sub{font-size:12px;line-height:1.5;color:var(--muted);margin:5px auto 0;max-width:360px}
.scanner-card{background:var(--soft);border:1px solid var(--line);border-radius:24px;padding:10px;box-shadow:0 10px 30px #22002d0c}.frame{background:#09090b;border-radius:19px;overflow:hidden;position:relative;min-height:330px;display:grid;place-items:center}#reader{width:100%;min-height:330px;background:#09090b}.scan-overlay{position:absolute;inset:22px;pointer-events:none;border:1px solid #ffffff18;border-radius:17px}.scan-overlay:before,.scan-overlay:after{content:"";position:absolute;width:38px;height:38px;border-color:var(--accent);border-style:solid}.scan-overlay:before{left:-1px;top:-1px;border-width:4px 0 0 4px;border-radius:12px 0 0 0}.scan-overlay:after{right:-1px;bottom:-1px;border-width:0 4px 4px 0;border-radius:0 0 12px 0}.scan-line{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 14px #20d38b88;animation:scan 2s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateY(-90px);opacity:.35}50%{transform:translateY(90px);opacity:1}}
.status{display:flex;gap:9px;align-items:center;margin-top:10px;padding:11px 12px;border:1px solid var(--line);background:#fff;border-radius:13px;color:#4f4953;font-size:11px;line-height:1.4}.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 8px}.status.error .dot{background:var(--danger)}
.actions{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}button{font:inherit;cursor:pointer}.primary{width:100%;border:0;border-radius:14px;padding:14px;background:var(--brand);color:#fff;font-weight:850}.secondary{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;color:var(--ink);font-weight:750}.primary:disabled{opacity:.55}.hint{text-align:center;color:#9a949d;font-size:9px;margin:11px 0 0}.secure{display:flex;justify-content:center;gap:5px;align-items:center;color:#8c858f;font-size:9px;margin-top:auto;padding-top:16px}.secure b{color:#20a873}
#reader video{width:100%!important;height:auto!important;object-fit:cover}#reader__scan_region{min-height:330px!important}#reader__dashboard{display:none!important}#reader__dashboard_section_csr{display:none!important}
@media(max-width:380px){.wrap{padding:10px}.frame,#reader,#reader__scan_region{min-height:300px!important}.hero{padding-bottom:10px}h1{font-size:21px}}
</style>
<style>#cameraPermissionHint{display:none!important}</style>
<script>
/* FLOWLITE_CAMERA_AUTO_PERMISSION_FIX */
(function(){
  window.flowLiteCameraPermissionReady=false;
  async function cameraPermissionGranted(){
    try{if(navigator.permissions&&navigator.permissions.query){const p=await navigator.permissions.query({name:'camera'});return p.state==='granted'}}catch(e){} return false;
  }
  window.flowLiteEnsureCamera=async function(startFn){
    try{if(await cameraPermissionGranted()){window.flowLiteCameraPermissionReady=true;return typeof startFn==='function'?await startFn():true}}catch(e){}
    try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});stream.getTracks().forEach(t=>t.stop());window.flowLiteCameraPermissionReady=true;return typeof startFn==='function'?await startFn():true}catch(err){window.flowLiteCameraPermissionReady=false;console.warn('Camera permission not available:',err);return false}
  };
})();
</script>
</head><body>
<div class="wrap">
  <div class="top"><div class="brand"><div class="logo"><span>FL</span><i></i></div><div><b>FlowLite</b><small>Scan &amp; Pay</small></div></div><button id="cancelBtn" class="close" type="button" aria-label="Back">×</button></div>
  <div class="hero"><div class="qr-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M7 25V13a6 6 0 0 1 6-6h12M39 7h12a6 6 0 0 1 6 6v12M57 39v12a6 6 0 0 1-6 6H39M25 57H13a6 6 0 0 1-6-6V39" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M35 7h16a6 6 0 0 1 6 6v16z" fill="#20d38b"/><rect x="18" y="18" width="11" height="11" rx="2" fill="none" stroke="#fff" stroke-width="4"/><rect x="39" y="20" width="10" height="10" rx="2" fill="none" stroke="#fff" stroke-width="4"/><path d="M18 39h10v10H18zM39 39h10M39 49h10M49 39v10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>Scan UPI QR</h1><div class="sub">Point your camera at a UPI QR code. We’ll send the payment request to your UPI app.</div></div>
  <div class="scanner-card"><div class="frame"><div id="reader"></div><div class="scan-overlay"><div class="scan-line"></div></div></div><div id="status" class="status"><span class="dot"></span><span>Starting secure camera…</span></div></div>
  <div class="actions"><button id="startBtn" class="primary" type="button">Start Camera</button><button id="cancelBtn2" class="secondary" type="button">Back to FlowLite</button></div>
  <div class="hint">Camera access is used only to scan the QR code. No image is uploaded.</div><div class="secure">● <b>Secure QR scanning</b> · FlowLite</div>
</div>
<script>
'use strict';
let scanner=null,done=false,starting=false;
const $=id=>document.getElementById(id); const status=t=>{$('status').querySelector('span:last-child').textContent=t;$('status').classList.toggle('error',/denied|could not|failed|requires|busy|found|load/i.test(t))};
function send(type,text){try{if(window.opener&&!window.opener.closed)window.opener.postMessage({type,text},'*')}catch(_){}
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type,text},'*')}catch(_){}
}
function scannerConfig(){const w=Math.max(220,Math.min(300,window.innerWidth-72));return{fps:10,qrbox:{width:w,height:w},aspectRatio:1.0};}
async function startCamera(){if(starting||scanner)return;starting=true;done=false;$('startBtn').disabled=true;status('Opening camera…');try{if(!window.isSecureContext)throw new Error('HTTPS');if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('NOAPI');if(typeof Html5Qrcode==='undefined')throw new Error('LIB');scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},scannerConfig(),onScanSuccess,()=>{})}catch(firstError){const devices=await Html5Qrcode.getCameras();if(!devices||!devices.length)throw firstError;const rear=devices.find(d=>/back|rear|environment|camera 0/i.test(d.label))||devices[devices.length-1];await scanner.start(rear.id,scannerConfig(),onScanSuccess,()=>{})}starting=false;status('Camera active · Align the QR inside the frame')}catch(e){console.error(e);try{if(scanner)await scanner.clear()}catch(_){}scanner=null;starting=false;$('startBtn').disabled=false;if(e&&e.name==='NotAllowedError')status('Camera permission denied. Allow Camera for this site, then reload.');else if(e&&e.name==='NotFoundError')status('No usable camera was found on this device.');else if(e&&e.name==='NotReadableError')status('Camera is busy. Close other apps using the camera and try again.');else if(e&&e.message==='HTTPS')status('Camera requires HTTPS. Open the GitHub Pages HTTPS address.');else if(e&&e.message==='NOAPI')status('This browser does not provide camera access. Open in Chrome.');else if(e&&e.message==='LIB')status('QR scanner library did not load. Check internet and reload.');else status('Camera could not start. Allow Camera permission and try again.')}}
async function onScanSuccess(text){if(done)return;done=true;status('QR detected · Opening payment flow…');try{if(scanner)await scanner.stop()}catch(_){}try{if(scanner)await scanner.clear()}catch(_){}scanner=null;send('FLOWLITE_UPI_QR_SCANNED',text);setTimeout(()=>{try{window.close()}catch(_){}},250)}
async function cancelScan(){done=true;try{if(scanner)await scanner.stop()}catch(_){}try{if(scanner)await scanner.clear()}catch(_){}scanner=null;send('FLOWLITE_UPI_QR_CANCELLED','');try{window.close()}catch(_){} }
$('startBtn').addEventListener('click',startCamera);$('cancelBtn').addEventListener('click',cancelScan);$('cancelBtn2').addEventListener('click',cancelScan);
window.addEventListener('load',function(){setTimeout(function(){if(typeof window.startCamera==='function')window.flowLiteEnsureCamera(window.startCamera)},350)});
</script>
</body></html>
