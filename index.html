<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flow Lite Pro — UPI QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
html,body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif;min-height:100%;}
.wrap{max-width:520px;margin:0 auto;padding:18px;}
.card{background:#151b31;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;box-shadow:0 18px 45px rgba(0,0,0,.25);}
h1{font-size:20px;margin:0 0 6px}.sub{font-size:12px;color:#aab4ca;line-height:1.5;margin-bottom:14px}
#reader{background:#000;border-radius:16px;overflow:hidden;min-height:280px}
.status{margin-top:12px;padding:10px 12px;border-radius:12px;background:#202944;color:#dbe4ff;font-size:12px;line-height:1.45}
button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;background:#4f46e5;color:#fff;font-weight:800}
.small{font-size:10px;color:#8994ad;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Scan UPI QR</h1>
<div class="sub">Allow camera access when prompted. Point the rear camera at the UPI QR code.</div>
<div id="reader"></div>
<div id="status" class="status">Requesting camera access…</div>
<button type="button" onclick="cancelScan()">Cancel</button>
<div class="small">Flow Lite Pro secure QR scanner</div>
</div></div>
<script>
let scanner=null,done=false;
function status(t){document.getElementById('status').textContent=t;}
function send(type,text){
  if(!window.opener || window.opener.closed) return;
  window.opener.postMessage({type,text},'*');
}
async function start(){
  if(typeof Html5Qrcode==='undefined'){status('QR scanner could not load. Check your internet connection.');return;}
  try{
    scanner=new Html5Qrcode('reader');
    // Starting by facingMode lets the browser request camera permission directly.
    await scanner.start(
      {facingMode:{ideal:'environment'}},
      {fps:10,qrbox:{width:Math.min(300,window.innerWidth-60),height:Math.min(300,window.innerWidth-60)}},
      async text=>{
        if(done)return;
        done=true;
        status('QR detected. Returning to Flow Lite Pro…');
        try{await scanner.stop();await scanner.clear();}catch(_){}
        send('FLOWLITE_UPI_QR_SCANNED',text);
        setTimeout(()=>window.close(),150);
      },
      ()=>{}
    );
    status('Camera is active. Scan a UPI QR code.');
  }catch(err){
    console.error(err);
    const n=err&&err.name;
    if(n==='NotAllowedError'||n==='PermissionDeniedError') status('Camera permission was denied. Allow Camera permission in Chrome/Android settings and reopen the scanner.');
    else if(n==='NotFoundError') status('No camera was found on this device.');
    else status('Camera access was denied or unavailable. Please check browser camera permission and try again.');
  }
}
function cancelScan(){
  done=true;
  try{if(scanner)scanner.stop().catch(()=>{});}catch(_){}
  send('FLOWLITE_UPI_QR_CANCELLED','');
  window.close();
}
start();
</script>
</body>
</html>
