<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flow Lite Pro — UPI QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
html,body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#151b31;border:1px solid #ffffff20;border-radius:20px;padding:16px}
h1{font-size:20px;margin:0 0 6px}.sub{font-size:12px;color:#aab4ca;line-height:1.5;margin-bottom:14px}
#reader{background:#000;border-radius:16px;overflow:hidden;min-height:280px}
.status{margin-top:12px;padding:10px 12px;border-radius:12px;background:#202944;color:#dbe4ff;font-size:12px;line-height:1.45}
button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;background:#4f46e5;color:#fff;font-weight:800}
button.secondary{background:#343b55}.small{font-size:10px;color:#8994ad;margin-top:10px;text-align:center}
</style></head><body>
<div class="wrap"><div class="card">
<h1>Scan UPI QR</h1>
<div class="sub">Tap Start Camera and allow camera access. Point the rear camera at the UPI QR code.</div>
<div id="reader"></div><div id="status" class="status">Ready. Tap Start Camera.</div>
<button id="startBtn" onclick="startCamera()">Start Camera</button>
<button class="secondary" onclick="cancelScan()">Cancel</button>
<div class="small">Flow Lite Pro secure QR scanner</div>
</div></div>
<script>
let scanner=null,done=false,starting=false;
const status=t=>document.getElementById('status').textContent=t;
function send(type,text){
  if(window.opener&&!window.opener.closed)
    window.opener.postMessage({type,text},'*');
}
async function startCamera(){
 if(starting||scanner)return; starting=true; done=false;
 const b=document.getElementById('startBtn'); b.disabled=true;
 status('Requesting camera permission…');
 try{
  if(!window.isSecureContext)throw Error('HTTPS');
  if(!navigator.mediaDevices?.getUserMedia)throw Error('NOAPI');
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  s.getTracks().forEach(t=>t.stop());
  if(typeof Html5Qrcode==='undefined')throw Error('LIB');
  scanner=new Html5Qrcode('reader');
  await scanner.start({facingMode:{ideal:'environment'}},
   {fps:10,qrbox:{width:Math.min(300,innerWidth-60),height:Math.min(300,innerWidth-60)}},
   async text=>{
    if(done)return; done=true; status('QR detected. Returning to Flow Lite Pro…');
    try{await scanner.stop()}catch(_{}); try{await scanner.clear()}catch(_){}
    send('FLOWLITE_UPI_QR_SCANNED',text); setTimeout(()=>window.close(),250);
   },()=>{});
  starting=false; status('Camera is active. Scan a UPI QR code.');
 }catch(e){
  scanner=null; starting=false; b.disabled=false; console.error(e);
  if(e.name==='NotAllowedError'||e.name==='PermissionDeniedError')
   status('Camera permission is blocked. Chrome → site controls near the address bar → Permissions → Camera → Allow, then reload.');
  else if(e.name==='NotFoundError')status('No usable camera was found on this device.');
  else if(e.name==='NotReadableError')status('Camera is busy. Close other apps using the camera and try again.');
  else status('Camera could not start. Check Chrome camera permission and try again.');
 }
}
function cancelScan(){done=true;try{scanner?.stop()}catch(_){}send('FLOWLITE_UPI_QR_CANCELLED','');window.close();}
</script></body></html>
