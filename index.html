<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flow Lite Pro — UPI QR Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
html,body{margin:0;background:#0b1020;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#151b31;border:1px solid #ffffff20;border-radius:20px;padding:16px}
h1{font-size:20px;margin:0 0 6px}.sub{font-size:12px;color:#aab4ca;line-height:1.5;margin-bottom:14px}
#reader{background:#000;border-radius:16px;overflow:hidden;min-height:280px}
.status{margin-top:12px;padding:10px 12px;border-radius:12px;background:#202944;color:#dbe4ff;font-size:12px;line-height:1.45}
button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:13px;background:#4f46e5;color:#fff;font-weight:800}
button.secondary{background:#343b55}.small{font-size:10px;color:#8994ad;margin-top:10px;text-align:center}
</style>
<style>
/* FLOWLITE_CAMERA_AUTO_PERMISSION_FIX */
#cameraPermissionHint { display:none !important; }
</style>
<script>
/* FLOWLITE_CAMERA_AUTO_PERMISSION_FIX */
(function(){
  window.flowLiteCameraPermissionReady = false;

  async function cameraPermissionGranted(){
    try {
      if (navigator.permissions && navigator.permissions.query) {
        const p = await navigator.permissions.query({name:'camera'});
        if (p.state === 'granted') return true;
      }
    } catch(e) {}
    return false;
  }

  window.flowLiteEnsureCamera = async function(startFn){
    try {
      if (await cameraPermissionGranted()) {
        window.flowLiteCameraPermissionReady = true;
        if (typeof startFn === 'function') return await startFn();
        return true;
      }
    } catch(e) {}

    // Request permission only when it has not already been granted.
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{ideal:'environment'}},
        audio:false
      });
      stream.getTracks().forEach(t=>t.stop());
      window.flowLiteCameraPermissionReady = true;
      if (typeof startFn === 'function') return await startFn();
      return true;
    } catch(err) {
      window.flowLiteCameraPermissionReady = false;
      console.warn('Camera permission not available:', err);
      return false;
    }
  };
})();
</script>

</head><body>
<div class="wrap"><div class="card">
<h1>Scan UPI QR</h1>
<div class="sub">Camera will start automatically when permission is available. Point the rear camera at the UPI QR code.</div>
<div id="reader"></div><div id="status" class="status">Ready. Tap Start Camera.</div>
<button id="startBtn" type="button">Start Camera</button>
<button id="cancelBtn" class="secondary" type="button">Cancel</button>
<div class="small">Flow Lite Pro secure QR scanner</div>
</div></div>
<script>
'use strict';
let scanner=null,done=false,starting=false;
const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;
function send(type,text){
  try{
    if(window.opener&&!window.opener.closed) window.opener.postMessage({type,text},'*');
  }catch(_){ }
}
function scannerConfig(){
  const w=Math.max(220,Math.min(300,window.innerWidth-60));
  return {fps:10,qrbox:{width:w,height:w},aspectRatio:1.0};
}
async function startCamera(){
  if(starting||scanner)return;
  starting=true; done=false;
  const b=$('startBtn'); b.disabled=true;
  status('Starting camera…');
  try{
    if(!window.isSecureContext) throw new Error('HTTPS');
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw new Error('NOAPI');
    if(typeof Html5Qrcode==='undefined') throw new Error('LIB');

    scanner=new Html5Qrcode('reader');

    // Directly let html5-qrcode request permission and open the rear camera.
    // Do not pre-open/stop getUserMedia: Android Chrome can reject that flow.
    try{
      await scanner.start(
        {facingMode:'environment'},
        scannerConfig(),
        onScanSuccess,
        ()=>{}
      );
    }catch(firstError){
      // Fallback: after permission has been granted, select a rear video device.
      const devices=await Html5Qrcode.getCameras();
      if(!devices||!devices.length) throw firstError;
      const rear=devices.find(d=>/back|rear|environment|camera 0/i.test(d.label))||devices[devices.length-1];
      await scanner.start(rear.id,scannerConfig(),onScanSuccess,()=>{});
    }

    starting=false;
    status('Camera is active. Scan a UPI QR code.');
  }catch(e){
    console.error('Flow Lite Pro camera error:',e);
    try{if(scanner)await scanner.clear()}catch(_){ }
    scanner=null; starting=false; b.disabled=false;
    if(e&&e.name==='NotAllowedError')
      status('Camera permission denied. Chrome site controls → Permissions → Camera → Allow, then reload.');
    else if(e&&e.name==='NotFoundError')
      status('No usable camera was found on this device.');
    else if(e&&e.name==='NotReadableError')
      status('Camera is busy. Close other apps using the camera and try again.');
    else if(e&&e.message==='HTTPS')
      status('Camera requires HTTPS. Open the GitHub Pages HTTPS address.');
    else if(e&&e.message==='NOAPI')
      status('This browser does not provide camera access. Open this page in Chrome.');
    else if(e&&e.message==='LIB')
      status('QR scanner library did not load. Check internet and reload the page.');
    else
      status('Camera could not start. Allow Camera permission in Chrome and try again.');
  }
}
async function onScanSuccess(text){
  if(done)return;
  done=true;
  status('QR detected. Returning to Flow Lite Pro…');
  try{if(scanner)await scanner.stop()}catch(_){ }
  try{if(scanner)await scanner.clear()}catch(_){ }
  scanner=null;
  send('FLOWLITE_UPI_QR_SCANNED',text);
  setTimeout(()=>{try{window.close()}catch(_){ }},250);
}
async function cancelScan(){
  done=true;
  try{if(scanner)await scanner.stop()}catch(_){ }
  try{if(scanner)await scanner.clear()}catch(_){ }
  scanner=null;
  send('FLOWLITE_UPI_QR_CANCELLED','');
  try{window.close()}catch(_){ }
}
$('startBtn').addEventListener('click',startCamera);
$('cancelBtn').addEventListener('click',cancelScan);
</script></body></html>

<script>
/* FLOWLITE_CAMERA_AUTO_START */
window.addEventListener('load', function(){
  setTimeout(function(){
    if (typeof window.startCamera === 'function') {
      window.flowLiteEnsureCamera(window.startCamera);
    }
  }, 350);
});
</script>
