<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FlowLite QR Diagnostic</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  margin:0;width:100%;height:100%;overflow:hidden;
  background:#07110c;color:#fff;
  font-family:Arial,Helvetica,sans-serif
}

#app{
  position:fixed;inset:0;background:#07110c;overflow:hidden
}

#video{
  position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;background:#07110c
}

#shade{
  position:absolute;inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.42),
    rgba(0,0,0,.04) 28%,
    rgba(0,0,0,.03) 65%,
    rgba(0,0,0,.38)
  );
  pointer-events:none
}

.top{
  position:absolute;left:0;right:0;top:0;
  padding:calc(env(safe-area-inset-top) + 22px) 28px 0;
  text-align:center;z-index:3
}

.title{
  font-size:24px;font-weight:600;
  text-shadow:0 1px 3px #000
}

.back{
  position:absolute;
  left:34px;
  top:calc(env(safe-area-inset-top) + 18px);
  width:32px;height:32px;
  border:0;background:none;color:#fff;
  font-size:42px;line-height:28px
}

.frame{
  position:absolute;
  left:15%;right:15%;
  top:27.3%;height:31.3%;
  border:1px solid rgba(255,255,255,.18);
  border-radius:36px;
  z-index:2
}

.corner{
  position:absolute;
  width:132px;height:132px;
  border-color:#fff;
  border-style:solid;
  border-width:0
}

.c1{
  left:-2px;top:-2px;
  border-left-width:7px;border-top-width:7px;
  border-radius:28px 0 0 0
}

.c2{
  right:-2px;top:-2px;
  border-right-width:7px;border-top-width:7px;
  border-radius:0 28px 0 0
}

.c3{
  left:-2px;bottom:-2px;
  border-left-width:7px;border-bottom-width:7px;
  border-radius:0 0 0 28px
}

.c4{
  right:-2px;bottom:-2px;
  border-right-width:7px;border-bottom-width:7px;
  border-radius:0 0 0 28px
}

#status{
  position:absolute;
  left:20px;right:20px;
  top:calc(env(safe-area-inset-top) + 92px);
  text-align:center;
  font-size:12px;
  z-index:5
}

#result{
  display:none;
  position:absolute;
  z-index:10;
  left:16px;right:16px;
  top:12%;bottom:8%;
  background:rgba(7,17,12,.98);
  border:1px solid rgba(255,255,255,.25);
  border-radius:18px;
  padding:20px;
  overflow:auto
}

#result h2{
  margin:0 0 12px;
  font-size:20px
}

#payload{
  width:100%;
  min-height:220px;
  background:#fff;
  color:#111;
  border:0;
  border-radius:10px;
  padding:12px;
  font-size:13px;
  line-height:1.45;
  resize:none
}

.btns{
  display:flex;
  gap:10px;
  margin-top:12px
}

.action{
  flex:1;
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:16px;
  font-weight:700
}

#copy{
  background:#36D66B;
  color:#07110c
}

#close{
  background:#fff;
  color:#111
}

#scanCanvas{
  display:none
}
</style>
</head>

<body>

<div id="app">

  <video id="video" autoplay muted playsinline></video>

  <div id="shade"></div>

  <div class="top">

    <button class="back" id="back" aria-label="Back">‹</button>

    <div class="title">
      Scan QR — Diagnostic
    </div>

  </div>

  <div class="frame" aria-hidden="true">

    <span class="corner c1"></span>
    <span class="corner c2"></span>
    <span class="corner c3"></span>
    <span class="corner c4"></span>

  </div>

  <div id="status"></div>

  <div id="result">

    <h2>Raw QR Payload</h2>

    <textarea
      id="payload"
      readonly
      spellcheck="false">
    </textarea>

    <div class="btns">

      <button
        class="action"
        id="copy">
        Copy Payload
      </button>

      <button
        class="action"
        id="close">
        Scan Again
      </button>

    </div>

  </div>

  <canvas id="scanCanvas"></canvas>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

<script>
(() => {

  const video =
    document.getElementById('video');

  const canvas =
    document.getElementById('scanCanvas');

  const ctx =
    canvas.getContext('2d',{
      willReadFrequently:true
    });

  const status =
    document.getElementById('status');

  const result =
    document.getElementById('result');

  const payload =
    document.getElementById('payload');

  const copy =
    document.getElementById('copy');

  const close =
    document.getElementById('close');

  const back =
    document.getElementById('back');

  let stream = null;
  let scanning = false;
  let handled = false;


  function showStatus(message){

    status.textContent = message;

    setTimeout(() => {
      status.textContent = '';
    },1600);

  }


  async function startCamera(){

    try{

      if(stream){

        stream
          .getTracks()
          .forEach(track => track.stop());

      }

      stream =
        await navigator
          .mediaDevices
          .getUserMedia({

            video:{
              facingMode:{
                ideal:'environment'
              },

              width:{
                ideal:1280
              },

              height:{
                ideal:720
              }

            },

            audio:false

          });


      video.srcObject = stream;

      scanning = true;

      handled = false;

      requestAnimationFrame(scan);


    }catch(error){

      showStatus(
        'Camera permission is required'
      );

    }

  }


  function scan(){

    if(
      !scanning ||
      handled
    ){
      return;
    }


    if(
      video.readyState >= 2 &&
      video.videoWidth
    ){

      const width =
        Math.min(
          video.videoWidth,
          900
        );

      const height =
        Math.round(
          video.videoHeight *
          width /
          video.videoWidth
        );


      canvas.width = width;
      canvas.height = height;


      ctx.drawImage(
        video,
        0,
        0,
        width,
        height
      );


      const image =
        ctx.getImageData(
          0,
          0,
          width,
          height
        );


      const code =
        window.jsQR
          ? jsQR(
              image.data,
              image.width,
              image.height,
              {
                inversionAttempts:
                  'attemptBoth'
              }
            )
          : null;


      if(
        code &&
        code.data
      ){

        handled = true;

        scanning = false;


        if(stream){

          stream
            .getTracks()
            .forEach(
              track => track.stop()
            );

        }


        /*
         IMPORTANT:
         We display the COMPLETE
         raw QR payload exactly as
         jsQR received it.

         No UPI parameters are
         removed or reconstructed.
        */

        payload.value =
          code.data;


        result.style.display =
          'block';


        payload.focus();
        payload.select();


        return;

      }

    }


    requestAnimationFrame(scan);

  }


  copy.addEventListener(
    'click',
    async () => {

      try{

        await navigator
          .clipboard
          .writeText(
            payload.value
          );


        copy.textContent =
          'Copied ✓';


        setTimeout(
          () => {
            copy.textContent =
              'Copy Payload';
          },
          1400
        );


      }catch(error){

        payload.focus();
        payload.select();

        showStatus(
          'Select and copy the payload'
        );

      }

    }
  );


  close.addEventListener(
    'click',
    () => {

      result.style.display =
        'none';

      startCamera();

    }
  );


  back.addEventListener(
    'click',
    () => {

      if(history.length > 1){

        history.back();

      }else{

        window.close();

      }

    }
  );


  window.addEventListener(
    'pagehide',
    () => {

      if(stream){

        stream
          .getTracks()
          .forEach(
            track => track.stop()
          );

      }

    }
  );


  startCamera();

})();
</script>

</body>
</html>
